name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Game (Release)
        run: cargo build --release

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Anti_VS
          Copy-Item "target/release/Anti_VS.exe" -Destination "dist/Anti_VS/Anti_VS.exe"
          if (Test-Path "assets") {
              Copy-Item "assets" -Destination "dist/Anti_VS/assets" -Recurse
          }
          Compress-Archive -Path "dist/Anti_VS/*" -DestinationPath "dist/Anti_VS-Windows.zip" -Force
          Copy-Item "target/release/Anti_VS.exe" -Destination "dist/Anti_VS.exe"

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Anti_VS-Windows.zip
            dist/Anti_VS.exe
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish Rolling Release (on Master Push)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Anti_VS Latest Build"
          body: "Автоматический билд последней версии из ветки master."
          files: |
            dist/Anti_VS-Windows.zip
            dist/Anti_VS.exe
          prerelease: true
